[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdrive-cli"
version = "0.1.0"
description = "Công cụ thao tác quản lý Google Drive trên Linux qua Terminal"
authors = [{ name = "Kaz" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
gdrive = "gdrive_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gdrive_cli*"]
